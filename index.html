<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تنبيه أمني 😂</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #050505;
        color: #00ff66;
        font-family: Tahoma, Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    .box {
        width: 90%;
        max-width: 500px;
        padding: 30px 20px;
        border: 2px solid #00ff66;
        border-radius: 15px;
        background: #080808;
        box-shadow: 0 0 25px #00ff6644;
    }

    .icon {
        font-size: 55px;
    }

    h1 {
        color: #ff3030;
        font-size: 27px;
    }

    p {
        color: white;
        font-size: 18px;
        line-height: 1.8;
    }

    .progress {
        width: 100%;
        height: 15px;
        background: #222;
        border-radius: 20px;
        overflow: hidden;
        margin: 25px 0 10px;
    }

    .bar {
        width: 0%;
        height: 100%;
        background: #00ff66;
        transition: width .25s;
    }

    #percent {
        font-size: 25px;
        font-weight: bold;
    }

    #result {
        display: none;
    }

    #result h2 {
        color: #00ff66;
        font-size: 35px;
    }

    button {
        border: none;
        background: #00ff66;
        color: #000;
        padding: 12px 25px;
        border-radius: 8px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }
</style>
</head>

<body>

<div class="box">

    <div id="hack">

        <div class="icon">⚠️</div>

        <h1>تم اختراق موبايلك بنجاح!</h1>

        <p>
            جاري فحص الجهاز...<br>
            جاري الوصول إلى الملفات...
        </p>

        <div class="progress">
            <div class="bar" id="bar"></div>
        </div>

        <div id="percent">0%</div>

    </div>


    <div id="result">

        <div class="icon">😂</div>

        <h2>اتخضيت ليه؟</h2>

        <p>
            اهدى يا صاحبي ❤️<br>
             😂
        </p>

        <button onclick="location.reload()">
             😈
        </button>

    </div>

</div>


<script>

let percent = 0;

let timer = setInterval(function () {

    percent += Math.floor(Math.random() * 8) + 3;

    if (percent >= 100) {
        percent = 100;
    }

    document.getElementById("bar").style.width = percent + "%";
    document.getElementById("percent").innerText = percent + "%";

    if (percent >= 100) {

        clearInterval(timer);

        setTimeout(function () {

            document.getElementById("hack").style.display = "none";
            document.getElementById("result").style.display = "block";

        }, 1000);
    }

}, 350);

</script>

</body>
</html>
